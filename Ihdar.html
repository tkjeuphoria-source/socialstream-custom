<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Notif WA iPhone Style — Social Stream Ninja</title>

<style>
  html,body { background: transparent; margin:0; padding:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial; }

  #notif-root {
    position: fixed;
    top: 22px;
    right: 16px;
    width: 320px;
    pointer-events: none;
    z-index: 9999;
  }

  .notif {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: rgba(255,255,255,0.96);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(18,18,18,0.18);
    padding: 10px 12px;
    margin-bottom: 10px;
    transform-origin: top right;
    opacity: 0;
    transform: translateY(-8px) scale(0.98);
    transition: transform 260ms cubic-bezier(.2,.9,.2,1), opacity 200ms ease;
    pointer-events: auto;
  }

  .notif.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .avatar {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    flex: 0 0 48px;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.06);
    background: linear-gradient(135deg,#e6e6e6,#ffffff);
  }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }

  .content { flex: 1; min-width: 0; }

  .meta {
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:2px;
  }

  .name {
    font-weight:600;
    font-size:15px;
    color:#0b1226;
    line-height:1;
    white-space:nowrap;
    text-overflow:ellipsis;
    overflow:hidden;
  }

  .time {
    font-size:12px;
    color:#6b7280;
    opacity:0.9;
  }

  .message {
    font-size:14px;
    color:#0b1226;
    opacity:0.92;
    margin-top:2px;
    line-height:1.25;
    display:block;
    max-height:3.25em;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  @media (max-width:420px){
    #notif-root { right:10px; left:10px; width: auto; }
    .notif { padding:8px; }
  }
</style>
</head>

<body data-session="8k6zc8A7p5">
  <div id="notif-root" aria-live="polite"></div>

<script>
(function(){
  function getSession(){
    const url = new URL(location.href);
    return url.searchParams.get('session') || document.body.dataset.session || null;
  }

  const session = getSession();
  const ROOT = document.getElementById('notif-root');

  if(!session){
    console.warn("Session ID belum diset. Tambahkan ?session=YOUR_ID di URL atau set data-session di <body>.");
    return;
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  function createNotif({username='User', message='', avatar='', time=''}) {
    const el = document.createElement('div');
    el.className = 'notif';
    el.innerHTML = `
      <div class="avatar"><img src="${avatar || 'https://via.placeholder.com/96?text=U'}" alt="avatar"></div>
      <div class="content">
        <div class="meta">
          <div class="name">${escapeHtml(username)}</div>
          <div style="flex:1"></div>
          <div class="time">${escapeHtml(time)}</div>
        </div>
        <div class="message">${escapeHtml(message)}</div>
      </div>`;
    return el;
  }

  function showNotif(data){
    const n = createNotif(data);
    ROOT.prepend(n);
    requestAnimationFrame(()=> n.classList.add('show'));
    setTimeout(()=> {
      n.classList.remove('show');
      setTimeout(()=> n.remove(), 300);
    }, 6000);
  }

  const sseUrl = 'https://io.socialstream.ninja/sse/' + encodeURIComponent(session);
  const evt = new EventSource(sseUrl, { withCredentials: true });

  evt.onopen = ()=> console.log('✅ Terhubung ke Social Stream Ninja SSE');
  evt.onerror = e => console.warn('⚠️ SSE Error:', e);

  function handleIncoming(raw){
    let obj;
    try { obj = JSON.parse(raw); } catch(e){ obj = { message: raw }; }

    const username = obj.username || obj.user || obj.author || 'Guest';
    const message = obj.message || obj.text || '';
    const avatar  = obj.avatar || (obj.user && obj.user.avatar) || '';
    const ts      = obj.timestamp || obj.time || new Date().toISOString();
    const timestr = (new Date(ts)).toLocaleTimeString();

    showNotif({ username, message, avatar, time: timestr });
  }

  evt.addEventListener('message', e => handleIncoming(e.data));
  evt.addEventListener('chat', e => handleIncoming(e.data));
})();
</script>
</body>
</html>
