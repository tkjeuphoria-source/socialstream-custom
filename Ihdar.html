<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Notif WA iPhone Style — Social Stream Ninja</title>

<style>
  /* Transparan untuk OBS */
  html,body { background: transparent; margin:0; padding:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial; }

  /* Container posisi kanan atas (mirip iPhone notif) */
  #notif-root {
    position: fixed;
    top: 22px;
    right: 16px;
    width: 320px;
    pointer-events: none; /* biar overlay tidak mengganggu klik OBS */
    z-index: 9999;
  }

  /* Satu notifikasi */
  .notif {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: rgba(255,255,255,0.96); /* iPhone putih sedikit transparan */
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(18,18,18,0.18);
    padding: 10px 12px;
    margin-bottom: 10px;
    transform-origin: top right;
    opacity: 0;
    transform: translateY(-8px) scale(0.98);
    transition: transform 260ms cubic-bezier(.2,.9,.2,1), opacity 200ms ease;
    pointer-events: auto;
  }

  .notif.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .avatar {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    flex: 0 0 48px;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.06);
    background: linear-gradient(135deg,#e6e6e6,#ffffff);
  }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }

  .content {
    flex: 1;
    min-width: 0;
  }

  .meta {
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:2px;
  }

  .name {
    font-weight:600;
    font-size:15px;
    color:#0b1226; /* dark */
    line-height:1;
    white-space:nowrap;
    text-overflow:ellipsis;
    overflow:hidden;
  }

  .time {
    font-size:12px;
    color:#6b7280;
    opacity:0.9;
  }

  .message {
    font-size:14px;
    color:#0b1226;
    opacity:0.92;
    margin-top:2px;
    line-height:1.25;
    display:block;
    max-height:3.25em; /* clamp to 2 lines approx */
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* small "badge" like iPhone unread indicator (optional) */
  .badge {
    background: #34c759; /* green WA-like */
    color: white;
    font-size:11px;
    padding:4px 8px;
    border-radius:999px;
    margin-left:auto;
    display:inline-block;
    font-weight:600;
  }

  /* minimal responsive */
  @media (max-width:420px){
    #notif-root { right:10px; left:10px; width: auto; }
    .notif { padding:8px; }
  }
</style>
</head>
<body>
  <div id="notif-root" aria-live="polite"></div>

<script>
/*
  Simple SSE listener for Social Stream Ninja.
  The endpoint pattern (server-sent events) is:
    https://io.socialstream.ninja/sse/{sessionID}
  We expect incoming events to have JSON with fields like:
    { "username":"Nama", "message":"isi pesan", "avatar":"https://...", "timestamp":"2025-10-27T..." }
  (The exact payload may vary; adapt the mapping below if needed.)
  Docs: Social Stream Ninja API / Commands & SSE.
*/

(function(){
  // Try to get session ID from URL param ?session=...
  function getSessionFromUrl(){
    const url = new URL(location.href);
    return url.searchParams.get('session') || document.body.datasetSession || null;
  }

  const session = getSessionFromUrl();

  const NOTIF_ROOT = document.getElementById('notif-root');

  // Helper create notif element
  function createNotif({username='Unknown', message='(no message)', avatar='', time=''}) {
    const el = document.createElement('div');
    el.className = 'notif';
    el.innerHTML = `
      <div class="avatar"><img src="${avatar || 'https://via.placeholder.com/96?text=U'}" alt="avatar"></div>
      <div class="content">
        <div class="meta">
          <div class="name">${escapeHtml(username)}</div>
          <div style="flex:1"></div>
          <div class="time">${escapeHtml(time)}</div>
        </div>
        <div class="message">${escapeHtml(message)}</div>
      </div>
    `;
    return el;
  }

  // HTML-escape (simple)
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];}); }

  // Show notification (animate in, remove after timeout)
  function showNotif(data){
    const n = createNotif(data);
    NOTIF_ROOT.prepend(n); // newest on top
    // trigger animation
    requestAnimationFrame(()=> n.classList.add('show'));

    // remove after 6s (fade out)
    setTimeout(()=> {
      n.classList.remove('show');
      // remove from DOM after transition
      setTimeout(()=> n.remove(), 300);
    }, 6000);
  }

  // If no session provided, print sample messages for preview
  if(!session){
    // preview if opened directly
    showNotif({username:'Ihdar', message:'Halo! ini notifikasi test — siap tampil di stream!', avatar:'https://i.pravatar.cc/150?img=12', time:new Date().toLocaleTimeString()});
    setTimeout(()=> showNotif({username:'Mira', message:'Jangan lupa set volume vokal ya!', avatar:'https://i.pravatar.cc/150?img=22', time:new Date().toLocaleTimeString()}), 1400);
    return;
  }

  // Build SSE URL
  const sseUrl = 'https://io.socialstream.ninja/sse/' + encodeURIComponent(session);

  try {
    const evt = new EventSource(sseUrl, { withCredentials: true });

    evt.onopen = function(){ console.info('SSE connected to Social Stream Ninja'); };
    evt.onerror = function(e){ console.warn('SSE error', e); };

    // social stream might emit event types; we handle generic 'message' and 'chat' events
    evt.addEventListener('message', function(e){
      handleIncoming(e.data);
    });

    evt.addEventListener('chat', function(e){
      handleIncoming(e.data);
    });

    // generic handler: try parse JSON or fallback
    function handleIncoming(raw){
      let obj;
      try { obj = JSON.parse(raw); } catch (err) {
        // fallback: treat raw as message
        obj = { username:'Guest', message: raw, avatar:'', timestamp: new Date().toISOString() };
      }

      // Map possible fields (adjust if your payload naming differs)
      const username = obj.username || obj.user || obj.author || (obj.data && obj.data.username) || 'Guest';
      const message = obj.message || obj.text || (obj.data && obj.data.message) || JSON.stringify(obj).slice(0,120);
      const avatar  = obj.avatar || (obj.user && obj.user.avatar) || '';
      const ts      = obj.timestamp || obj.time || obj.date || new Date().toISOString();
      const timestr = (new Date(ts)).toLocaleTimeString();

      showNotif({ username, message, avatar, time: timestr });
    }
  } catch (err) {
    console.error('Cannot open SSE:', err);
    // fallback: show offline message
    showNotif({username:'System', message:'Gagal konek ke SSE — periksa session ID atau koneksi.', avatar:'', time:new Date().toLocaleTimeString()});
  }

})();
</script>
</body>
</html>
